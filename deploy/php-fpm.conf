; PHP-FPM pool for sebule.jeffgicharu.com
; Installed as /etc/php/8.4/fpm/pool.d/sebule.conf by deploy/provision.sh.

[sebule]
user = sebule
group = sebule

listen = /run/php/sebule.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M

; Each release has its own path and FPM is reloaded on deploy, so files
; never change underneath a running pool.
php_admin_value[opcache.validate_timestamps] = 0
